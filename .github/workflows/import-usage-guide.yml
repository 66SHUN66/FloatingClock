name: import-usage-guide
# One-shot helper: refreshes docs/usage-zh.md (now covering the English edition), then
# removes itself.
on:
  push:
    paths:
      - '.github/workflows/import-usage-guide.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the guide
        run: |
          set -euo pipefail
          curl -fsSL 'https://aka.doubaocdn.com/s/aq1UF36pAk' -o docs/usage-zh.md
          test $(stat -c %s docs/usage-zh.md) -eq 11227
          grep -q '英文版与 GitHub' docs/usage-zh.md

      - name: Commit and self-destruct
        run: |
          set -euo pipefail
          git config user.name 'SHUN'
          git config user.email '66SHUN66@users.noreply.github.com'
          git rm -f .github/workflows/import-usage-guide.yml
          git add docs/usage-zh.md
          git commit -m 'docs: user guide now covers the English edition and downloads'
          git push
