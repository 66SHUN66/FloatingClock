name: import-docs-and-release
# One-shot helper: brings in the refreshed docs / icon / screenshots (uploaded as
# plain files from the build machine), rebuilds both editions, publishes the v1.2
# release, then removes itself.
on:
  push:
    paths:
      - '.github/workflows/import-docs-and-release.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import docs and assets
        shell: cmd
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/uNTJZvQJU5" -o README.md
          curl -fsSL "https://aka.doubaocdn.com/s/rDWGMCkMj0" -o README_EN.md
          curl -fsSL "https://aka.doubaocdn.com/s/utuz2u1iGo" -o .gitattributes
          if not exist assets mkdir assets
          curl -fsSL "https://aka.doubaocdn.com/s/zqnD2CHLda" -o assets\app.ico
          if not exist docs mkdir docs
          curl -fsSL "https://aka.doubaocdn.com/s/KlaZsqOiHR" -o docs\clock.png
          curl -fsSL "https://aka.doubaocdn.com/s/a4zwKqqDVs" -o docs\settings.png
          curl -fsSL "https://aka.doubaocdn.com/s/UiKb2MKUrU" -o docs\settings-footer.png
          curl -fsSL "https://aka.doubaocdn.com/s/0kS1FeM6sZ" -o docs\usage-zh.md
          dir assets docs

      - name: Sanity check
        shell: pwsh
        run: |
          if (-not (Select-String -Path README.md -Pattern 'docs/clock.png' -Quiet)) { throw 'README.md was not updated' }
          if (-not (Select-String -Path README_EN.md -Pattern 'docs/clock.png' -Quiet)) { throw 'README_EN.md was not updated' }
          if ((Get-Item assets/app.ico).Length -ne 16081) { throw 'icon size mismatch' }
          if ((Get-Item docs/clock.png).Length -ne 12841) { throw 'clock.png size mismatch' }
          'checks ok'

      - name: Build both editions
        shell: cmd
        run: build\build.bat

      - name: Report build output
        shell: pwsh
        run: Get-ChildItem dist/*.exe | Select-Object Name, Length

      - name: Commit and self-destruct
        shell: pwsh
        run: |
          git config user.name 'SHUN'
          git config user.email '66SHUN66@users.noreply.github.com'
          git rm -f .github/workflows/import-docs-and-release.yml
          git add -A README.md README_EN.md .gitattributes assets docs
          git commit -m 'docs: refreshed readme, icon and interface screenshots'
          git push

      - name: Publish v1.2 release with both exe files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: FloatingClock v1.2
          files: dist/*.exe
          generate_release_notes: true
