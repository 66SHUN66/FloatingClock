name: import-icon-and-rebuild
# One-shot helper: un-ignores and commits the app icon, rebuilds both editions with
# the icon embedded, refreshes the v1.2 release assets, then removes itself.
on:
  push:
    paths:
      - '.github/workflows/import-icon-and-rebuild.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import .gitignore and the icon
        shell: cmd
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/HvzJn1lz2N" -o .gitignore
          if not exist assets mkdir assets
          curl -fsSL "https://aka.doubaocdn.com/s/SiHSrtcGlN" -o assets\app.ico
          dir assets

      - name: Rebuild with the icon embedded
        shell: cmd
        run: build\build.bat

      - name: Report build output
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | Select-Object Name, Length
          foreach ($f in Get-ChildItem dist/*.exe) {
            if ($f.Length -lt 90000) { throw "$($f.Name) looks un-iconed ($($f.Length) bytes)" }
          }

      - name: Commit and self-destruct
        shell: pwsh
        run: |
          git config user.name 'SHUN'
          git config user.email '66SHUN66@users.noreply.github.com'
          git rm -f .github/workflows/import-icon-and-rebuild.yml
          git add -f .gitignore assets/app.ico
          git commit -m 'build: ship the app icon so the exe gets its own icon'
          git push

      - name: Refresh the v1.2 release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: FloatingClock v1.2
          files: dist/*.exe
          overwrite_files: true
