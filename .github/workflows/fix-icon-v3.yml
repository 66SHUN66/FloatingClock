name: fix-icon-v3
# One-shot helper: commits the icon and the fixed .gitignore, rebuilds both editions
# (a no-icon build is 65536 bytes, an icon build 81920), refreshes the v1.2 assets
# and removes all the temporary import workflows.
on:
  push:
    paths:
      - '.github/workflows/fix-icon-v3.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download icon and .gitignore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path assets -Force | Out-Null
          Invoke-WebRequest -Uri 'https://aka.doubaocdn.com/s/HvzJn1lz2N' -OutFile '.gitignore' -TimeoutSec 60
          Invoke-WebRequest -Uri 'https://aka.doubaocdn.com/s/SiHSrtcGlN' -OutFile 'assets/app.ico' -TimeoutSec 60
          Write-Host "gitignore=$((Get-Item '.gitignore').Length) ico=$((Get-Item 'assets/app.ico').Length)"
          if ((Get-Item 'assets/app.ico').Length -ne 16081) { throw 'icon download looks wrong' }
          if ((Get-Content '.gitignore' -Raw) -match 'assets/app.ico') { throw '.gitignore still ignores the icon' }

      - name: Rebuild both editions
        shell: cmd
        run: build\build.bat

      - name: Check the builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in Get-ChildItem dist/*.exe) {
            Write-Host "$($f.Name) $($f.Length) bytes"
            if ($f.Length -ne 81920) { throw "$($f.Name) is $($f.Length) bytes, expected 81920 (icon embedded)" }
          }

      - name: Commit, refresh release, self-destruct
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'SHUN'
          git config user.email '66SHUN66@users.noreply.github.com'
          git rm -f .github/workflows/fix-icon-v3.yml
          git rm -f .github/workflows/fix-icon-v2.yml
          git rm -f .github/workflows/import-icon-and-rebuild.yml
          git add -f .gitignore assets/app.ico
          git commit -m 'build: ship the app icon so the exe carries it'
          git push

      - name: Refresh the v1.2 assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: FloatingClock v1.2
          files: dist/*.exe
          overwrite_files: true
